[project]
name = "python-uv-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Heiko Deserno", email = "heiko@deserno-mail.de" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.138.1",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "go-task-bin>=3.51.1",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[project.scripts]
update-packages = "app:main"
upload-files = "app.client.runner:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
link-mode = "copy"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unittests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E302"]
preview = true



